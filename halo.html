<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>URL Parameter</title>
        <style>
            body {
               font-family: Arial, sans-serif;
               background: #202124;
               color: white;
               padding: 30px;
            }
            
            button {
               padding: 12px 20px;
               border: 0;
               border-radius: 8px;
               background: #5865f2;
               color: white;
               font-size: 16px;
               cursor: pointer;
            }
         </style>
</head>
<body>
    
    <h2>Profil User</h2>
    <button onclick="buka()">Buka Profil</button>

<script>
function buka() {
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");

    if (!url) {
        alert("URL tidak ditemukan");
        return;
    }

    window.location.href = "/" + url;
}
</script>
</body>
</html>
