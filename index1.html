<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no"
>

<title>Roblox Indonesia</title>

<style>

/* =====================================
   RESET
===================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #000;
    color: #fff;
}


/* =====================================
   HALAMAN
===================================== */

.halaman {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    background-image:
        linear-gradient(
            rgba(0, 0, 0, 0.60),
            rgba(0, 0, 0, 0.82)
        ),
        url("img/background.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* =====================================
   OVERLAY
===================================== */

.halaman::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.25),
            rgba(0,0,0,.15) 40%,
            rgba(0,0,0,.60)
        );

    pointer-events: none;
}


/* =====================================
   KONTEN
===================================== */

.konten {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 700px;

    min-height: 100vh;

    margin: auto;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 5px 15px 25px;
}


/* =====================================
   GAMBAR ROBLOX INDONESIA
===================================== */

.judul {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;
}

.judul-img {
    display: block;
    width: 90%;
    max-width: 570px;
    height: auto;
    object-fit: contain;
}


/* =====================================
   SUB JUDUL
===================================== */

.subjudul {
    width: 100%;
    margin-top: 23px;
    text-align: center;
    font-size: clamp(17px, 4.5vw, 25px);
    line-height: 1.35;
    font-weight: 400;
    text-shadow:
        0 2px 4px rgba(0,0,0,.8);
}

.subjudul span {
    color: #f00000;
}


/* =====================================
   LOGO TENGAH
===================================== */

.logo-box {
    width: 100px;
    height: 100px;
    margin-top: 170px;
    border-radius: 50%;
    overflow: hidden;
    background: #1111ee;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow:
        0 5px 20px rgba(0,0,0,.55);
}

.logo-box img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}


/* =====================================
   TEKS SELAMAT DATANG
===================================== */

.welcome {
    width: 100%;
    max-width: 380px;
    margin-top: 25px;
    margin-left: -5px;
    text-align: left;
    font-size: clamp(23px, 6vw, 30px);
    line-height: 1.28;
    font-weight: 700;
    text-shadow:
        0 2px 5px rgba(0,0,0,.8);
}

.welcome span {
    color: #f00000;
}


/* =====================================
   AREA TOMBOL
===================================== */

.tombol {
    width: 100%;
    max-width: 600px;        
    margin-top: 185px;
}


/* =====================================
   TOMBOL
===================================== */

.btn {
    width: 100%;
    height: 70px;
    border: 0;
    border-radius: 14px;
    margin-top: 25px;
    background: #3762f5;
    color: white;
    font-family: inherit;
    font-size: 21px;
    font-weight: 700;
    cursor: pointer;
    box-shadow:
        0 5px 12px rgba(0,0,0,.25);

    transition:
        transform .15s ease,
        background .15s ease;
}


/* Tombol pertama */

.btn.browser {
    color: #ed2630;
}


/* Hover */

.btn:hover {
    background: #2e58ed;
}


/* Saat ditekan */

.btn:active {
    transform: scale(.97);
}

</style>
</head>


<body>

<div class="halaman">

    <main class="konten">


        <!-- =================================
             GAMBAR ROBLOX INDONESIA
        ================================== -->

        <div class="judul">

            <img
                src="img/logo.png"
                alt="Roblox Indonesia"
                class="judul-img"
            >

        </div>


        <!-- =================================
             SUB JUDUL
        ================================== -->

        <div class="subjudul">

            Jelajahi Situs Browser Roblox
            <span>Indonesia</span> kami

        </div>


        <!-- =================================
             LOGO
        ================================== -->

        <div class="logo-box">

            <img
                src="logo.png"
                alt="Logo Roblox Indonesia"
            >

        </div>


        <!-- =================================
             WELCOME
        ================================== -->

        <div class="welcome">

            Selamat Datang Di<br>
            Website Roblox<br>
            <span>Indonesia</span>

        </div>


        <!-- =================================
             TOMBOL
        ================================== -->

        <div class="tombol">

            <button
                type="button"
                class="btn browser"
                onclick="lanjutkanBrowser()"
            >
                Lanjutkan di browser
            </button>


            <button
                type="button"
                class="btn"
                onclick="lanjutkanProfil()"
            >
                Lanjutkan di profil saya
            </button>

        </div>


    </main>

</div>


<script>

/* =====================================
   TOMBOL BROWSER
===================================== */

function lanjutkanBrowser() {

    window.location.href = "/index.html";

}


/* =====================================
   TOMBOL PROFIL
===================================== */

function lanjutkanProfil() {

    window.location.href =
        "/users/profil.html";

}

</script>

</body>
</html>
